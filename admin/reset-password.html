<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Set New Password | Fawaz Cafeteria</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #071315;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      display: block;
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin: 0 auto 15px;
    }

    h1 {
      text-align: center;
      color: #003b40;
      font-size: 23px;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      color: #333;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d7e5e5;
      border-radius: 9px;
      font-size: 14px;
      margin-bottom: 15px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #006f78;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
      color: #777;
      min-height: 18px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #006f78;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">

    <img
      src="../images/fawaz-logo-transparent.png"
      alt="Fawaz Cafeteria Logo"
      class="logo"
    >

    <h1>Set New Password</h1>

    <p class="subtitle">
      Create a new password for your admin account
    </p>

    <form id="resetForm">

      <label for="password">New Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter new password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        required
      >

      <button type="submit" id="saveButton">
        Save New Password
      </button>

    </form>

    <div id="status">Ready</div>

    <a href="./" class="back">
      ← Back to Admin Login
    </a>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://vqoyhnrhlpnwtnvdxpjn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_9s15tPt0smgSEX_Hsr-t_g_xYH_QFY3";

    const status =
      document.getElementById("status");

    const form =
      document.getElementById("resetForm");

    const saveButton =
      document.getElementById("saveButton");

    if (!window.supabase) {

      status.textContent =
        "Supabase library could not load.";

    } else {

      const supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

      form.addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();

          const password =
            document.getElementById("password").value;

          const confirmPassword =
            document.getElementById("confirmPassword").value;

          if (password !== confirmPassword) {

            status.textContent =
              "Passwords do not match.";

            return;
          }

          if (password.length < 6) {

            status.textContent =
              "Password must be at least 6 characters.";

            return;
          }

          saveButton.disabled = true;

          status.textContent =
            "Saving new password...";

          try {

            const { error } =
              await supabaseClient.auth.updateUser({
                password: password
              });

            if (error) {

              status.textContent =
                "Password update failed: " +
                error.message;

              saveButton.disabled = false;

              return;
            }

            status.textContent =
              "Password updated successfully.";

            setTimeout(function() {

              window.location.href =
                "./";

            }, 1500);

          } catch (error) {

            status.textContent =
              "Error: " + error.message;

            saveButton.disabled = false;
          }

        }
      );
    }
  </script>

</body>
</html>
