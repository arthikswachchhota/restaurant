<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | Fawaz Cafeteria</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071315;
      color: #123;
      padding: 20px;
    }

    .dashboard {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    h1 {
      color: #003b40;
      margin-bottom: 10px;
    }

    .welcome {
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      padding: 20px;
      border-radius: 14px;
      background: #eefafa;
      margin-bottom: 15px;
    }

    .logout {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #006f78;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="dashboard">

    <h1>Fawaz Cafeteria Admin</h1>

    <p class="welcome">
      Welcome to the management dashboard.
    </p>

    <div class="card">
      <strong>Food Management</strong>
      <p>Add, edit and manage food items.</p>
    </div>

    <div class="card">
      <strong>Price Management</strong>
      <p>Update food prices.</p>
    </div>

    <div class="card">
      <strong>Gallery Management</strong>
      <p>Manage cafeteria gallery.</p>
    </div>

    <button class="logout" id="logoutButton">
      Logout
    </button>

  </div>
