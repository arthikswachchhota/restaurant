<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Fawaz Cafeteria</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #071315;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    h1 {
      text-align: center;
      color: #003b40;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #123;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d5dfe0;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }

    input:focus {
      border-color: #00b7c3;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #00b7c3;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #006f78;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #006f78;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <img src="../images/fawaz-logo-transparent.png" alt="Fawaz Cafeteria Logo">
    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Fawaz Cafeteria Management
    </p>

    <form id="loginForm">

      <label for="email">Email / Username</label>

      <input
        type="email"
        id="email"
        placeholder="Enter email"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button type="button" id="loginButton">
        Login
      </button>

    </form>

    <a class="back-home" href="../index.html">
      ← Back to Home
    </a>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
  const SUPABASE_URL = "https://vqoyhnrhlpnwtnvdxpjn.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_9s15tPt0smgSEX_Hsr-t_g_xYH_QFY3";

  const status = document.createElement("p");

  status.id = "loginStatus";
  status.style.textAlign = "center";
  status.style.marginTop = "15px";
  status.style.fontSize = "14px";

  document.querySelector(".login-box").appendChild(status);

  if (!window.supabase) {

    status.textContent =
      "Supabase library could not load.";

  } else {

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    document
      .getElementById("loginButton")
      .addEventListener("click", async function() {

        const email = document
          .getElementById("email")
          .value
          .trim();

        const password = document
          .getElementById("password")
          .value;

        const button =
          document.getElementById("loginButton");

        if (!email || !password) {

          status.textContent =
            "Please enter email and password.";

          return;
        }

        button.disabled = true;
        button.textContent = "Logging in...";

        status.textContent =
          "Connecting to Supabase...";

        try {

          const { data, error } =
            await supabase.auth.signInWithPassword({
              email: email,
              password: password
            });

          console.log("LOGIN DATA:", data);
          console.log("LOGIN ERROR:", error);

          if (error) {

            status.textContent =
              "Login failed: " + error.message;

            button.disabled = false;
            button.textContent = "Login";

            return;
          }

          status.textContent =
            "Login successful!";

          button.textContent =
            "Logged in";

        } catch (err) {

          console.error(err);

          status.textContent =
            "Connection error: " + err.message;

          button.disabled = false;
          button.textContent = "Login";
        }

      });
  }
</script>

</body>
</html>
