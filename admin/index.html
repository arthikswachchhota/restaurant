<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Fawaz Cafeteria</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #071315;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo img {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }

    h1 {
      text-align: center;
      color: #003b40;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #123;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d5dfe0;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }

    input:focus {
      border-color: #00b7c3;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #00b7c3;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #006f78;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #006f78;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <img src="../images/fawaz-logo-transparent.png" alt="Fawaz Cafeteria Logo">
    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Fawaz Cafeteria Management
    </p>

    <form id="loginForm">
  <label for="email">Email / Username</label>
  <input
        type="text"
        id="email"
        placeholder="Enter email or username"
        autocomplete="username"
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >

      <button type="submit">
        Login
      </button>
    </form>

    <a class="back-home" href="../index.html">
      ← Back to Home
    </a>

  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
</html>
